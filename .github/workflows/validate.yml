name: Validate submission

# Runs on every pull request that touches the data. This is what makes the
# "decision within 7 days" promise cheap to keep: format, dead links and
# duplicates are caught by CI, so a human only ever reviews whether the app
# itself belongs here.

on:
  pull_request:
    paths:
      - "data/apps.json"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "data/apps.json"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schema
        run: python3 scripts/check.py

      # This has to run BEFORE the link check. --check-links rewrites
      # lastChecked in the data, so if it ran first every build would differ
      # from the committed one by nothing but today's date, and the job would
      # fail for no real reason. Keeping generated files in sync is the
      # contributor's job; keeping verification dates fresh is the weekly job's.
      - name: Ensure generated files match the committed data
        run: |
          python3 scripts/build.py
          if ! git diff --quiet -- README.md llms.txt badge.svg BADGE.md site/; then
            echo "::error::Generated files are out of date."
            echo "Run 'python3 scripts/build.py' and commit the result."
            git diff --stat -- README.md llms.txt badge.svg BADGE.md site/
            exit 1
          fi
          echo "Generated files are in sync."

      - name: Verify every entry resolves and still exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check.py --check-links
