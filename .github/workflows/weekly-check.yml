name: Weekly link check

# The whole claim of this catalog is that entries are verified rather than
# accumulated. That claim is only true if something actually re-checks them,
# so this runs every Monday, refreshes lastChecked, and commits the result.
#
# If a link has died, the entry is marked unreachable in the data, the README
# renders a warning next to it, and an issue is opened so it does not sit
# rotting unnoticed.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-check every link
        id: check
        run: |
          set +e
          GH_TOKEN="${{ github.token }}" python3 scripts/check.py --check-links > result.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
        continue-on-error: true

      - name: Rebuild generated files
        run: python3 scripts/build.py

      - name: Commit refreshed verification dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git add data/apps.json README.md llms.txt badge.svg BADGE.md site/
          git commit -m "Weekly link check: refresh verification dates"
          git push

      - name: Open an issue if anything is unreachable
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly link check found unreachable entries" \
            --body "$(printf 'The scheduled check could not reach one or more listed apps.\n\n```\n%s\n```\n\nThey are marked `unreachable` in `data/apps.json` and flagged in the README. Fix the URL or remove the entry.' "$(cat result.txt)")"
